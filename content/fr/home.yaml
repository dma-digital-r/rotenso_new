seo:
  title: Rotenso
  subtitle: Systèmes CVC innovants pour la maison et l’entreprise
  text: |-
    Nous sommes une entreprise polonaise spécialisée dans la climatisation, la VMC double flux, les pompes à chaleur et les systèmes de climatisation avancés (RVF). Nos produits sont adaptés aux besoins des particuliers et des professionnels. Nous misons sur des technologies qui apportent confort, air sain et économies réelles.

    Grâce à un développement constant et à l’élargissement de notre catalogue, la marque gagne la reconnaissance des utilisateurs et des partenaires dans toute l’Europe, en proposant des solutions adaptées aux besoins individuels et à différents types de bâtiments. Rotenso est synonyme d’efficacité, d’innovation et de design moderne, ce qui fait de nos appareils un excellent choix pour tous ceux qui recherchent une qualité durable.
  background: /images/home/seo-bg.png
