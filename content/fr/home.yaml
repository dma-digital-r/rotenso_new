  text: |-
    Les VMC double flux Rotenso Wentilo assurent un apport constant d’air frais et filtré avec récupération de chaleur ou d’humidité, tout en réduisant les frais de chauffage. La commande intelligente vous garantit un confort toute la journée, sans effort supplémentaire.

