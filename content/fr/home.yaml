seoTitle: Rotenso — climatisation, VMC double flux, pompes à chaleur
seoDescription: Systèmes CVC innovants pour la maison et l’entreprise — climatiseurs, VMC double flux, pompes à chaleur et systèmes RVF / VRF.
heroSlides:
  - tab: Climatisation
    title: Climatisation
    text: Rotenso propose une large gamme de systèmes de climatisation qui garantissent une température idéale toute l’année.
    primary:
      label: Découvrir les modèles
      href: /fr/klimatyzacja
    secondary:
      label: Voir les nouveautés
      href: /fr/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: VMC double flux
    title: VMC double flux
    text: Un apport constant d’air frais et filtré avec récupération de chaleur ou d’humidité.
    primary:
      label: Découvrir les modèles
      href: /fr/rekuperacja
    secondary:
      label: Voir les nouveautés
      href: /fr/rekuperacja
    background: null
  - tab: Pompes à chaleur
    title: Pompes à chaleur
    text: Chauffage économique et sans entretien des bâtiments et production d’eau chaude sanitaire.
    primary:
      label: Découvrir les modèles
      href: /fr/pompy-ciepla
    secondary:
      label: Voir les nouveautés
      href: /fr/pompy-ciepla
    background: null
  - tab: Systèmes RVF
    title: Systèmes RVF
    text: Un contrôle précis de la température dans plusieurs zones à la fois — pour bureaux, hôtels et locaux commerciaux.
    primary:
      label: Découvrir les modèles
      href: /fr/systemy-rvf
    secondary:
      label: Voir les nouveautés
      href: /fr/systemy-rvf
    background: null
