splitVsMulti:
  title: Split ou multi-split ?
  split:
    image: /images/products/splitVsMulti/split/image.jpg
    title: Système split
    text: Le type de climatisation le plus simple et le plus choisi pour une maison ou un appartement. Il se compose d’une unité à l’intérieur de la pièce (généralement murale) et d’une unité à l’extérieur du bâtiment. C’est la solution idéale pour le confort d’une pièce en particulier, par exemple le salon ou la chambre.
  multi:
    image: /images/products/splitVsMulti/multi/image.jpg
    title: Système multi-split
    text: Un bon choix si vous voulez climatiser plusieurs pièces à la fois sans pouvoir ou vouloir installer plusieurs unités extérieures sur la façade. Une seule unité est installée à l’extérieur et alimente plusieurs climatiseurs intérieurs. L’ensemble est esthétique et prend peu de place.
