  title: Demander un devis
  text: |-
    Votre confort est notre standard.
    Laissez vos coordonnées et un installateur vous préparera une offre d’installation de climatisation.
  background: /images/forms/quoteForm/background.jpg
  step1: |-
    Étape 1.
    Laissez-nous vos coordonnées. Votre demande sera transmise à un installateur de climatisation près de chez vous.
  phone: Votre numéro de téléphone*
  email: Votre adresse e-mail*
  postcode: Code postal du lieu d’installation*
  contactTime: Moment de contact préféré
  contactTimes:
    - Matin (8h–12h)
    - Après-midi (12h–16h)
    - Soir (16h–20h)
    - Peu importe
  consent: J’accepte le traitement de mes données personnelles...
  required: '*champs obligatoires'
  submit: Envoyer le message
  success: Merci ! Votre demande a été envoyée — un installateur vous contactera prochainement.
  error: Votre demande n’a pas pu être envoyée. Réessayez dans un instant ou appelez-nous.
  step2Image: /images/forms/quoteForm/step2Image.jpg
  step2: |-
    Étape 2.
    L’installateur vous contactera pour choisir le climatiseur adapté et vous présenter une offre.
