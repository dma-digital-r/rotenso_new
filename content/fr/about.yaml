  title: Une entreprise polonaise à vision mondiale
  text: |-
    Rotenso est une marque polonaise depuis le premier jour. Nous ne sommes pas le distributeur d’un fabricant étranger — nous concevons nos produits pour le climat, les maisons et les conditions d’utilisation polonaises.

    Nous associons un savoir-faire d’ingénierie local aux technologies modernes et proposons des solutions comparables à celles des leaders mondiaux du secteur — à un prix compétitif et avec un service local dans toute la Pologne.
