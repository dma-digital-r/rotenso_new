timeline:
  title: Et tout a commencé par...
  text: Découvrez l’histoire de la marque Rotenso
  items:
    - year: '2000'
      title: Naissance de Thermosilesia
      text: En Silésie, Thermosilesia commence son activité — une entreprise d’installation, de service et de vente de systèmes de climatisation RAC et CAC des grands fabricants. C’est la base sur laquelle Rotenso naîtra 14 ans plus tard.
    - year: '2009'
      title: Des débuts logistiques modestes
      text: L’entreprise ne dispose que de 150 m² d’entrepôt et de 80 emplacements de palettes — le point de départ de l’actuel centre logistique de plus de 20 000 m².
    - year: '2010'
      title: Lancement du programme de marques propres
      text: Thermosilesia lance un programme de production, de développement et de promotion de ses propres marques CVC — une décision stratégique qui, quatre ans plus tard, mènera à la création de Rotenso.
    - year: '2012'
      title: Lancement de la marque Ferono
      text: 'La première marque propre mise sur le marché : les ventilateurs et rideaux d’air Ferono — un test du modèle bientôt répété avec Rotenso.'
    - year: '2014'
      title: Naissance de Rotenso
      text: Les climatiseurs Rotenso, marque phare de Thermosilesia, arrivent sur le marché polonais. Dès lors, l’entreprise investit dans la technologie inverter, la conception d’unités murales, cassettes et commerciales, et la construction d’un réseau d’installateurs.
    - year: 2015 – 2018
      title: Un portefeuille de marques qui s’agrandit
      text: Naissent successivement Tivento (tubes cuivre isolés), Swedo (pompes de relevage), Ivensis (accessoires de montage) et Cleanairix (chimie de service professionnelle). En 2018, l’équipe Thermosilesia compte déjà 47 personnes.
    - year: '2019'
      title: Un nouveau centre logistique
      text: Après le déménagement à Ruda Śląska, le centre logistique de Thermosilesia passe à 4 300 m² et 6 700 emplacements de palettes. Rotenso dispose de vraies capacités pour développer ses ventes.
    - year: 2020 – 2022
      title: De la climatisation au CVC complet
      text: 'L’offre Rotenso dépasse les climatiseurs muraux : arrivent les pompes à chaleur air-eau (Aquami, Airmi, Windmi, Heatmi), des systèmes commerciaux étendus et des unités VRF/RVF. Les appareils fonctionnent au fluide écologique R32.'
    - year: '2023'
      title: Le réseau de partenaires s’étend
      text: Rotenso développe son réseau d’installateurs et de service agréés en Pologne et en Europe, élargit sa gamme de climatiseurs muraux (séries Versu, Mirai, Elis, Ukura, Imoto…) et organise régulièrement des formations techniques pour les installateurs.
    - year: '2024'
      title: Wentilo ICON et les 24 ans de Thermosilesia
      text: Au salon MCE de Milan, Rotenso présente une toute nouvelle gamme de centrales Wentilo ICON. Thermosilesia fête ses 24 ans, l’équipe compte 188 personnes et l’entreprise reçoit un Diamant Forbes pour sa croissance dynamique.
    - year: '2025'
      title: Warsaw HVAC Expo et un nouveau centre
      text: Rotenso présente ses nouveautés au Warsaw HVAC Expo. À Ruda Śląska démarre la construction de l’un des plus grands investissements de l’histoire de l’entreprise — un nouveau centre logistique de plus de 17 000 m².
    - year: '2026'
      title: Rotenso aujourd’hui
      text: Le centre logistique dépasse 20 000 m² et 29 000 emplacements de palettes. Rotenso lance un nouveau catalogue de systèmes RVF pour la saison 2026/27 et de nouvelles séries de climatiseurs (Luve, Teta, Roni, Fresh…), et est présent en Pologne, en Allemagne, en France, en Tchéquie, en Italie et en Ukraine.
