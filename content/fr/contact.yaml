form:
  title: Formulaire de contact
  text: Quel est l’objet de votre message ?
  topic: Choisissez un sujet / service*
  topics:
    - Question sur un produit
    - Assistance technique / SAV
    - Garantie et réclamations
    - Partenariat et installateurs
    - Investissements et systèmes RVF
    - Autres
  name: Nom et prénom*
  email: Adresse e-mail*
  phone: Téléphone
  postcode: Code postal
  message: Message...
  consent: J’accepte le traitement de mes données personnelles...
  consentFull: Le responsable du traitement de vos données personnelles est Thermosilesia sp. z o. o. sp. k. Vos données sont collectées afin de répondre à la demande envoyée via le formulaire de contact. Vous disposez d’un droit d’accès à vos données, de rectification, d’effacement ou de limitation du traitement, d’un droit à la portabilité, de retrait du consentement et d’opposition. Les détails du traitement sont disponibles sur https://rotenso.com/pl/ dans la rubrique « RGPD ».
  consentMore:
    label: En savoir plus
    href: /fr/rodo
  privacy:
    label: Découvrez comment nous traitons vos données.
    href: /fr/rodo
  required: '*champs obligatoires'
  submit: Envoyer le message
  success: Merci ! Votre message a été envoyé — nous vous répondrons dans les plus brefs délais.
  error: Le message n’a pas pu être envoyé. Réessayez dans un instant ou appelez-nous.
