why:
  title: Pourquoi remplacer les filtres ?
  text: Quelques raisons de remplacer régulièrement les filtres
  items:
    - image: /images/filters/why-powietrze.avif
      title: Un air sain et propre
      text: Un filtre encrassé ne retient plus la poussière, le pollen, le smog ni la pollution extérieure. Un vieux filtre peut aussi devenir un nid de bactéries et de moisissures soufflées directement chez vous.
    - image: /images/filters/why-wilgoc.avif
      title: Protection contre l’humidité
      text: Des filtres bouchés freinent le débit d’air et l’air devient confiné. L’humidité favorise les moisissures sur les murs. Un filtre propre évacue efficacement la vapeur d’eau et évite la buée sur les vitres.
    - image: /images/filters/why-zywotnosc.avif
      title: Durée de vie prolongée
      text: 'Les filtres protègent vos poumons mais aussi le cœur de l’appareil : l’échangeur. Si la saleté pénètre plus loin, la récupération de chaleur baisse, l’appareil devient bruyant et une panne coûteuse peut survenir.'
