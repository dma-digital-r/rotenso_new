company:
  background: /images/about/company-bg.jpg
  title: Polská firma s globální vizí
  text: |-
    Rotenso je polská značka od prvního dne. Nejsme distributorem zahraničního výrobce — navrhujeme produkty s ohledem na polské klima, polské domy a polské provozní podmínky.

    Spojujeme místní inženýrské know-how s moderními technologiemi a nabízíme řešení srovnatelná se světovými lídry oboru — za konkurenceschopnou cenu a s místním servisem v celém Polsku.
  videoImage: /images/about/company-video.jpg
  videoUrl: ''
ecosystem:
  background: /images/about/ecosystem-bg.jpg
  title: Komplexní ekosystém
  text: Klimatizace, tepelná čerpadla, větrání a příslušenství — vše od jednoho výrobce, s jednou servisní sítí a společnou zárukou.
  tiles:
    - image: /images/about/tile-ac.jpg
      title: Klimatizace
      text: Od základních modelů po prémiové s filtrací a Smart Home. Jednopokojové i vícepokojové (multi split) do každého interiéru.
      cta:
        label: Poznejte modely
        href: /cs/klimatyzacja
    - image: /images/about/tile-reku.jpg
      title: Rekuperace
      text: Rekuperační jednotky Wentilo zajišťují stálý přívod čerstvého, filtrovaného vzduchu a získávají zpět teplo, které by jinak z domu uniklo.
      cta:
        label: Poznejte modely
        href: /cs/rekuperacja
    - image: /images/about/tile-hp.jpg
      title: Tepelná čerpadla
      text: Tepelná čerpadla vzduch-voda pro vytápění domu a ohřev teplé vody — ve verzích split, monoblock a all-in.
      cta:
        label: Poznejte modely
        href: /cs/pompy-ciepla
    - image: /images/about/tile-rvf.jpg
      title: Systémy RVF
      text: Systémy RVF/VRF pro kanceláře, hotely a komerční objekty — přesné řízení teploty v mnoha zónách současně.
      cta:
        label: Poznejte modely
        href: /cs/systemy-rvf
