timeline:
  title: A všechno to začalo...
  text: Poznejte příběh značky Rotenso
  items:
    - year: '2000'
      title: Vznik Thermosilesie
      text: Ve Slezsku zahajuje činnost Thermosilesia — firma zabývající se montáží, servisem a prodejem klimatizačních systémů RAC a CAC předních výrobců. Je to základ, na kterém za 14 let vznikne Rotenso.
    - year: '2009'
      title: Skromné začátky logistiky
      text: Firma má pouhých 150 m² skladové plochy a 80 paletových míst — výchozí bod pro dnešní logistické centrum o rozloze přes 20 000 m².
    - year: '2010'
      title: Start programu vlastních značek
      text: Thermosilesia zahajuje program výroby, vývoje a propagace vlastních značek HVAC — strategické rozhodnutí, které o čtyři roky později povede ke vzniku Rotenso.
    - year: '2012'
      title: Debut značky Ferono
      text: První vlastní značkou na trhu jsou ventilátory a vzduchové clony Ferono — ověření modelu, který se brzy zopakuje u Rotenso.
    - year: '2014'
      title: Vznik Rotenso
      text: Na polském trhu debutují klimatizace Rotenso — vlajková značka Thermosilesie. Od té doby firma investuje do invertorové technologie, vývoje nástěnných, kazetových a komerčních jednotek a budování sítě instalatérů.
    - year: 2015 – 2018
      title: Rozšíření portfolia značek
      text: Postupně vznikají Tivento (izolované měděné trubky), Swedo (čerpadla kondenzátu), Ivensis (montážní příslušenství) a Cleanairix (profesionální servisní chemie). V roce 2018 má tým Thermosilesie již 47 lidí.
    - year: '2019'
      title: Nové logistické centrum
      text: Po přestěhování do Rudy Śląske roste logistické centrum Thermosilesie na 4 300 m² a počet paletových míst na 6 700. Rotenso získává skutečné zázemí pro růst prodeje.
    - year: 2020 – 2022
      title: Od klimatizace k úplnému HVAC
      text: 'Nabídka Rotenso přesahuje nástěnné klimatizace: přibývají tepelná čerpadla vzduch-voda (Aquami, Airmi, Windmi, Heatmi), rozšířené komerční systémy a jednotky VRF/RVF. Zařízení pracují s ekologickým chladivem R32.'
    - year: '2023'
      title: Partnerská síť roste
      text: Rotenso rozšiřuje síť autorizovaných instalatérů a servisů v Polsku i Evropě, rozšiřuje nabídku nástěnných klimatizací (mj. řady Versu, Mirai, Elis, Ukura, Imoto) a pravidelně pořádá technická školení pro instalatérský obor.
    - year: '2024'
      title: Wentilo ICON a 24 let Thermosilesie
      text: Na veletrhu MCE v Miláně představuje Rotenso zcela novou řadu rekuperačních jednotek Wentilo ICON. Thermosilesia slaví 24 let, tým čítá 188 lidí a firma získává Forbes Diamant za dynamiku růstu.
    - year: '2025'
      title: Warsaw HVAC Expo a nové centrum
      text: Rotenso představuje novinky na Warsaw HVAC Expo. V Rudě Śląske začíná výstavba jedné z největších investic v historii firmy — nového logistického centra o rozloze přes 17 000 m².
    - year: '2026'
      title: Rotenso dnes
      text: Logistické centrum dosahuje přes 20 000 m² a 29 000 paletových míst. Rotenso uvádí nový katalog systémů RVF pro sezónu 2026/27 a další řady klimatizací (mj. Luve, Teta, Roni, Fresh) a působí v Polsku, Německu, Francii, Česku, Itálii a na Ukrajině.
