why:
  title: Proč měnit filtry?
  text: Několik důvodů, proč filtry pravidelně měnit
  items:
    - image: /images/filters/why-powietrze.avif
      title: Zdravý a čistý vzduch
      text: Znečištěný filtr přestává zachycovat prach, pyl, smog a venkovní nečistoty. Starý filtr se navíc může stát líhní bakterií a plísní, které se pak fouká přímo do domu.
    - image: /images/filters/why-wilgoc.avif
      title: Ochrana před vlhkostí
      text: Ucpané filtry brání proudění vzduchu a vzniká dusno. Hromadící se vlhkost podporuje plísně na stěnách. Čistý filtr účinně odvádí vodní páru a brání například rosení oken.
    - image: /images/filters/why-zywotnosc.avif
      title: Delší životnost zařízení
      text: Filtry chrání nejen vaše plíce, ale i srdce jednotky – výměník tepla. Pokud se nečistoty dostanou hlouběji, klesne účinnost rekuperace, jednotka bude hlučnější a hrozí nákladná porucha.
