form:
  title: Kontaktní formulář
  text: Čeho se vaše zpráva týká?
  topic: Vyberte téma / oddělení*
  topics:
    - Dotaz k produktu
    - Technická podpora / servis
    - Záruka a reklamace
    - Spolupráce a montážní firmy
    - Investice a systémy RVF
    - Ostatní
  name: Jméno a příjmení*
  email: E-mailová adresa*
  phone: Telefon
  postcode: PSČ
  message: Zpráva...
  consent: Souhlasím se zpracováním svých osobních údajů...
  consentFull: Správcem vašich osobních údajů je Thermosilesia sp. z o. o. sp. k. Vaše údaje shromažďujeme, abychom odpověděli na dotaz zaslaný prostřednictvím kontaktního formuláře. Máte právo na přístup ke svým údajům, na jejich opravu, výmaz nebo omezení zpracování, právo na přenositelnost, odvolání souhlasu a vznesení námitky. Podrobnosti o zpracování najdete na https://rotenso.com/pl/ v sekci „GDPR“.
  consentMore:
    label: Více informací
    href: /cs/rodo
  privacy:
    label: Zjistěte, jak zpracováváme vaše údaje.
    href: /cs/rodo
  required: '*povinná pole'
  submit: Odeslat zprávu
  success: Děkujeme! Vaše zpráva byla odeslána — odpovíme co nejdříve.
  error: Zprávu se nepodařilo odeslat. Zkuste to prosím za chvíli znovu nebo nám zavolejte.
