seo:
  title: Rotenso
  subtitle: Inovativní systémy HVAC pro domácnosti i firmy
  text: |-
    Jsme polská společnost, která se specializuje na klimatizace, rekuperaci, tepelná čerpadla a pokročilé klimatizační systémy (RVF). Naše produkty jsou přizpůsobeny potřebám soukromých i firemních zákazníků. Sázíme na technologie, které přinášejí komfort, čistý vzduch a skutečné úspory.

    Díky neustálému vývoji a rozšiřování katalogu produktů si značka získává uznání uživatelů i partnerů po celé Evropě a nabízí řešení přizpůsobená individuálním potřebám a různým typům budov. Rotenso je synonymem účinnosti, inovace a moderního designu, díky čemuž jsou naše jednotky skvělou volbou pro všechny, kdo hledají kvalitu na dlouhá léta.
  background: /images/home/seo-bg.png
