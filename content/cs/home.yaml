seoTitle: Rotenso — klimatizace, rekuperace, tepelná čerpadla
seoDescription: Inovativní systémy HVAC pro domácnosti i firmy — klimatizace, rekuperační jednotky, tepelná čerpadla a systémy RVF / VRF.
heroSlides:
  - tab: Klimatizace
    title: Klimatizace
    text: Rotenso nabízí širokou škálu klimatizačních systémů, které zajistí ideální teplotu po celý rok.
    primary:
      label: Poznejte modely
      href: /cs/klimatyzacja
    secondary:
      label: Zobrazit novinky
      href: /cs/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: Rekuperace
    title: Rekuperace
    text: Stálý přívod čerstvého a filtrovaného vzduchu se zpětným získáváním tepla nebo vlhkosti.
    primary:
      label: Poznejte modely
      href: /cs/rekuperacja
    secondary:
      label: Zobrazit novinky
      href: /cs/rekuperacja
    background: null
  - tab: Tepelná čerpadla
    title: Tepelná čerpadla
    text: Úsporné a bezúdržbové vytápění budov a ohřev teplé vody.
    primary:
      label: Poznejte modely
      href: /cs/pompy-ciepla
    secondary:
      label: Zobrazit novinky
      href: /cs/pompy-ciepla
    background: null
  - tab: Systémy RVF
    title: Systémy RVF
    text: Přesné řízení teploty v mnoha zónách současně — pro kanceláře, hotely a komerční objekty.
    primary:
      label: Poznejte modely
      href: /cs/systemy-rvf
    secondary:
      label: Zobrazit novinky
      href: /cs/systemy-rvf
    background: null
idea:
  title: Klimatizace Rotenso je komfort, který ucítíte od první chvíle.
  text: Chladí, topí a čistí vzduch a váš domov se stane oázou klidu. Elegantní design a tichý provoz z jednotek dělají přirozenou součást interiéru. Ovládání je jednoduché a intuitivní, takže klid máte vždy na dosah.
  background: /images/home/idea-bg.png
