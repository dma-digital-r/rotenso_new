form:
  title: Contact form
  text: What is your message about?
  topic: Choose a topic / department*
  topics:
    - Product question
    - Technical support / service
    - Warranty and complaints
    - Partnership and installers
    - Investments and RVF systems
    - Other
  name: Full name*
  email: E-mail address*
  phone: Phone number
  postcode: Postcode
  message: Message...
  consent: I consent to the processing of my personal data...
  consentFull: The controller of your personal data is Thermosilesia sp. z o. o. sp. k. Your data is collected in order to answer the enquiry sent via the contact form. You have the right to access your personal data, to request its rectification, erasure or restriction of processing, the right to data portability, to withdraw consent and to object. Details of the processing are available at https://rotenso.com/pl/ in the “GDPR” section.
  consentMore:
    label: Learn more
    href: /en/rodo
  privacy:
    label: See how we process your data.
    href: /en/rodo
  required: '*required fields'
  submit: Send message
  success: Thank you! Your message has been sent — we will reply as soon as possible.
  error: The message could not be sent. Please try again in a moment or give us a call.
