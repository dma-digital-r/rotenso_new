why:
  title: Why replace filters?
  text: Some of the reasons to replace filters regularly
  items:
    - image: /images/filters/why-powietrze.avif
      title: Healthy, clean air
      text: A dirty filter no longer stops dust, pollen, smog and outdoor pollution. An old, clogged filter can also become a breeding ground for bacteria and fungi, which are then blown straight into your home.
    - image: /images/filters/why-wilgoc.avif
      title: Protection against moisture
      text: Clogged filters block the airflow and make the air stuffy. Accumulating moisture encourages mould on the walls. A clean filter removes water vapour effectively and prevents, for example, fogged windows.
    - image: /images/filters/why-zywotnosc.avif
      title: Longer unit life
      text: Filters protect not only your lungs but also the heart of the unit – the heat exchanger. If dirt gets deeper, heat recovery drops, the system gets louder and in time a costly failure may follow.
