timeline:
  title: And it all started with...
  text: Discover the story of the Rotenso brand
  items:
    - year: '2000'
      title: Thermosilesia is born
      text: Thermosilesia starts operating in Silesia — a company installing, servicing and selling RAC and CAC air conditioning systems of leading manufacturers. It is the foundation on which Rotenso will be built 14 years later.
    - year: '2009'
      title: Humble beginnings in logistics
      text: The company has just 150 m² of warehouse space and 80 pallet places — the starting point for today's logistics centre of more than 20,000 m².
    - year: '2010'
      title: Own-brand programme launched
      text: Thermosilesia starts a programme to produce, develop and promote its own HVAC brands — a strategic decision that four years later leads to the creation of Rotenso.
    - year: '2012'
      title: Ferono brand debuts
      text: The first own brand on the market is Ferono fans and air curtains — a test of the model that will soon be repeated with Rotenso.
    - year: '2014'
      title: Rotenso is born
      text: Rotenso air conditioners debut on the Polish market as Thermosilesia's flagship brand. From then on the company invests in inverter technology, the design of wall, cassette and commercial units, and building an installer network.
    - year: 2015 – 2018
      title: A growing brand portfolio
      text: One after another come Tivento (insulated copper pipes), Swedo (condensate pumps), Ivensis (installation accessories) and Cleanairix (professional service chemicals). By 2018 the Thermosilesia team has 47 people.
    - year: '2019'
      title: A new logistics centre
      text: After moving to Ruda Śląska, Thermosilesia's logistics centre grows to 4,300 m² and its pallet places to 6,700. Rotenso gains real capacity to scale its sales.
    - year: 2020 – 2022
      title: From air conditioning to full HVAC
      text: 'Rotenso''s range goes beyond wall-mounted air conditioners: air-to-water heat pumps (Aquami, Airmi, Windmi, Heatmi), extended commercial systems and VRF/RVF units arrive. The units run on the eco-friendly R32 refrigerant.'
    - year: '2023'
      title: The partner network grows
      text: Rotenso expands its network of authorised installers and service in Poland and Europe, broadens its range of wall-mounted air conditioners (including the Versu, Mirai, Elis, Ukura and Imoto series) and runs regular technical training for the installation industry.
    - year: '2024'
      title: Wentilo ICON and Thermosilesia's 24th anniversary
      text: At MCE in Milan Rotenso presents a brand-new line of Wentilo ICON heat recovery units. Thermosilesia celebrates 24 years in business, the team numbers 188 people and the company receives a Forbes Diamond for its rapid growth.
    - year: '2025'
      title: Warsaw HVAC Expo and a new centre
      text: Rotenso presents its new products at Warsaw HVAC Expo. In Ruda Śląska construction begins on one of the largest investments in the company's history — a new logistics centre of more than 17,000 m².
    - year: '2026'
      title: Rotenso today
      text: The logistics centre reaches more than 20,000 m² and 29,000 pallet places. Rotenso launches a new RVF systems catalogue for the 2026/27 season and further air conditioner series (including Luve, Teta, Roni and Fresh), and is present in Poland, Germany, France, Czechia, Italy and Ukraine.
