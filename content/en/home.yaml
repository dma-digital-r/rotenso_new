seo:
  title: Rotenso
  subtitle: Innovative HVAC systems for homes and businesses
  text: |-
    We are a Polish company specialising in air conditioning, heat recovery ventilation, heat pumps and advanced air conditioning systems (RVF). Our products are tailored to the needs of private and business customers. We focus on technologies that deliver comfort, clean air and real savings.

    Thanks to continuous development and an expanding product range, the brand is gaining recognition among users and partners across Europe, offering solutions tailored to individual needs and different types of buildings. Rotenso stands for efficiency, innovation and modern design, making our units an excellent choice for anyone looking for lasting quality.
  background: /images/home/seo-bg.png
