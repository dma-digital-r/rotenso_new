splitVsMulti:
  title: Split czy Multi Split?
  split:
    image: /images/products/splitVsMulti/split/image.jpg
    title: System Split
    text: >-
      To najprostszy i najczęściej wybierany rodzaj klimatyzacji do domu lub
      mieszkania. Składa się z jednego urządzenia w środku pomieszczenia (zwykle
      na ścianie) i jednego urządzenia na zewnątrz budynku. To rozwiązanie
      sprawdzi się idealnie, jeśli chcesz zadbać o komfort w jednym konkretnym
      pomieszczeniu, np. w salonie lub sypialni.
  multi:
    image: /images/products/splitVsMulti/multi/image.jpg
    title: System Multi Split
    text: >-
      To dobry wybór, gdy chcesz mieć klimatyzację w wielu pomieszczeniach
      jednocześnie, a nie możesz lub nie chcesz montować kilku agregatów na
      elewacji budynku. Na zewnątrz budynku instalowane jest więc jedno
      urządzenie, które obsługuje kilka klimatyzatorów w środku. Całość wygląda
      estetycznie i nie zajmuje dużo miejsca.
quoteForm:
  title: Zapytaj o wycenę
  text: >-
    Twój komfort to dla nas standard.

    Podaj swoje dane kontaktowe, a instalator przygotuje dla Ciebie ofertę
    montażu klimatyzacji.
  background: /images/forms/quoteForm/background.jpg
  step1: >-
    Krok 1.

    Zostaw nam swoje dane kontaktowe. Twoje zgłoszenie trafi do instalatora
    klimatyzacji w Twojej okolicy.
  phone: Podaj swój nr telefonu*
  email: Podaj swój adres e-mail*
  postcode: Kod pocztowy miejsca instalacji*
  contactTime: Preferowana pora kontaktu
  contactTimes:
    - Rano (8:00–12:00)
    - Po południu (12:00–16:00)
    - Wieczorem (16:00–20:00)
    - Obojętnie
  consent: Wyrażam zgodę na przetwarzanie moich danych osobowych...
  required: '*pola wymagane'
  submit: Wyślij wiadomość
  success: >-
    Dziękujemy! Twoje zgłoszenie zostało wysłane — instalator skontaktuje się z
    Tobą wkrótce.
  error: >-
    Nie udało się wysłać zgłoszenia. Spróbuj ponownie za chwilę albo zadzwoń do
    nas.
  step2Image: /images/forms/quoteForm/step2Image.jpg
  step2: >-
    Krok 2.

    Instalator skontaktuje się z Tobą, aby dopasować odpowiednią klimatyzację i
    przedstawić ofertę.
  step3Image: /images/forms/quoteForm/step3Image.jpg
  step3: |-
    Krok 3.
    Gdy zaakceptujesz ofertę, instalator zamontuje wybraną klimatyzację.
