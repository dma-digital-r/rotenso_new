seo:
  title: Rotenso
  subtitle: Innowacyjne systemy HVAC dla domu i biznesu
  text: |-
    Jesteśmy polską firmą, która specjalizuje się w klimatyzacji, rekuperacji, pompach ciepła oraz zaawansowanych systemach klimatyzacyjnych (RVF). Nasze produkty są dopasowane do potrzeb klientów indywidualnych i biznesowych. Stawiamy na technologie, które zapewniają komfort, czyste powietrze i realne oszczędności.

    Dzięki stałemu rozwojowi i rozszerzaniu katalogu produktów marka zyskuje uznanie użytkowników oraz partnerów w całej Europie, dając rozwiązania dostosowane do indywidualnych potrzeb i różnych typów budynków. Rotenso to synonim wydajności, innowacyjności i nowoczesnego designu, co czyni nasze urządzenia doskonałym wyborem dla osób poszukujących jakości na lata.
  background: /images/home/seo-bg.png
