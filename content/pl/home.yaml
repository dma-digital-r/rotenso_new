seoTitle: Rotenso — klimatyzacja, rekuperacja, pompy ciepła
seoDescription: Innowacyjne systemy HVAC dla domu i biznesu — klimatyzatory, rekuperatory, pompy ciepła i systemy RVF / VRF.
heroSlides:
  - tab: Klimatyzacje
    title: Klimatyzacje
    text: Rotenso to bogactwo systemów klimatyzacyjnych, które zapewniają idealną temperaturę przez cały rok.
    primary:
      label: Poznaj modele
      href: /pl/klimatyzacja
    secondary:
      label: Zobacz nowości
      href: /pl/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: Rekuperacja
    title: Rekuperacja
    text: Stały dopływ świeżego i filtrowanego powietrza z odzyskiem ciepła lub wilgoci.
    primary:
      label: Poznaj modele
      href: /pl/rekuperacja
    secondary:
      label: Zobacz nowości
      href: /pl/rekuperacja
    background: null
  - tab: Pompy ciepła
    title: Pompy ciepła
    text: Ekonomiczne i bezobsługowe ogrzewanie budynków oraz przygotowywanie ciepłej wody użytkowej.
    primary:
      label: Poznaj modele
      href: /pl/pompy-ciepla
    secondary:
      label: Zobacz nowości
      href: /pl/pompy-ciepla
    background: null
  - tab: Systemy RVF
    title: Systemy RVF
    text: Precyzyjne sterowanie temperaturą w wielu strefach jednocześnie — dla biur, hoteli i obiektów komercyjnych.
    primary:
      label: Poznaj modele
      href: /pl/systemy-rvf
    secondary:
      label: Zobacz nowości
      href: /pl/systemy-rvf
    background: null
idea:
  title: Klimatyzacja Rotenso to komfort, który poczujesz od pierwszej chwili.
  text: Chłodzi, ogrzewa i oczyszcza powietrze, a Ty zyskujesz azyl w swoim domu. Elegancki design i cicha praca sprawiają, że urządzenia stają się naturalną częścią wnętrza. Sterowanie jest proste i intuicyjne, dzięki czemu spokój zawsze jest na wyciągnięcie ręki.
  background: /images/home/idea-bg.png
