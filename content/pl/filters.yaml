why:
  title: Dlaczego wymieniać filtry?
  text: Poznaj niektóre powody, dla których warto wymieniać filtry regularnie
  items:
    - image: /images/filters/why-powietrze.avif
      title: Zdrowe i czyste powietrze
      text: Zabrudzony filtr przestaje zatrzymywać kurz, pyłki, smog i zanieczyszczenia z zewnątrz. Dodatkowo, stary i zanieczyszczony filtr może stać się siedliskiem bakterii oraz grzybów, które następnie są nawiewane prosto do Twojego domu.
    - image: /images/filters/why-wilgoc.avif
      title: Ochrona przed wilgocią
      text: Zatkane filtry blokują przepływ powietrza, powodując zaduch. Gromadząca się wilgoć sprzyja powstawaniu pleśni na ścianach. Czysty filtr gwarantuje skuteczne usuwanie pary wodnej, zapobiegając chociażby parowaniu okien.
    - image: /images/filters/why-zywotnosc.avif
      title: Dłuższa żywotność urządzenia
      text: Filtry chronią nie tylko Twoje płuca, ale też serce rekuperatora – wymiennik ciepła. Jeśli brud przedostanie się głębiej, doprowadzi do spadku sprawności odzysku ciepła, głośniejszej pracy układu, a z czasem może skutkować kosztowną awarią urządzenia.
