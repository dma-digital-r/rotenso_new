faq:
  - question: Czym wyróżnia się klimatyzator Rotenso Roni?
    answer: Roni to kompaktowy, minimalistyczny klimatyzator ścienny z wbudowanym WiFi i nawiewem 4D — dobry wybór tam, gdzie jest mało miejsca na montaż.
  - question: Czy Roni nadaje się do grzania?
    answer: Tak. Klimatyzator skutecznie ogrzewa nawet przy temperaturze zewnętrznej do -20°C (klasa A+ w grzaniu, SCOP 4,0).
  - question: Czy Roni można podłączyć do systemu multi split?
    answer: Tak. Jednostki wewnętrzne Roni współpracują z agregatami Hiro N-Line w systemie multi split.
