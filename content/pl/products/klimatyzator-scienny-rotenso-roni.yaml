description: Model Roni to bardzo popularna jednostka w ofercie Rotenso. Jego zaletą są niewielkie rozmiary pozwalające na dyskretny montaż, szczególnie gdy do dyspozycji jest ograniczona przestrzeń. Optymalne parametry i pakiet niezbędnych funkcji sprawia, że klimatyzator Roni to doskonały wybór. Klasyczny, biały wygląd, delikatnie złamany złotą linią idealnie wkomponuje się w wystrój niemalże każdego pomieszczenia.
