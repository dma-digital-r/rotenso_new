featureRows:
  - image: /images/products/roni-row-4d.jpg
    video: ''
    title: |-
      Automatyczne
      żaluzje 4D
    text: Wbudowane siłowniki umożliwiają sterowanie pracą żaluzji pionowych i poziomych za pomocą pilota lub sterownika ściennego. Gwarantuje to najwyższy komfort obsługi i zapewnia wydajne rozprowadzenie powietrza w pomieszczeniu.
  - image: /images/products/roni-row-filtry.jpg
    video: ''
    title: |-
      System zdrowego
      powietrza
    text: System zdrowego powietrza składa się aż z 10 etapów oczyszczania i filtracji powietrza, dzięki czemu usuwa z otoczenia większość szkodliwych bakterii, wirusów, roztoczy i grzybów, abyś mógł oddychać czystym i zdrowym powietrzem.
