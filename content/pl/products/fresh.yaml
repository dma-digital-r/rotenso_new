faq:
  - question: Czym wyróżnia się klimatyzator Rotenso Fresh?
    answer: Poza chłodzeniem i grzaniem Fresh doprowadza do pomieszczenia świeże powietrze z zewnątrz — do 60 m³/h — kanałem wentylacyjnym za obudową klimatyzatora, bez otwierania okien.
  - question: Czy Rotenso Fresh jest energooszczędny?
    answer: Tak. Fresh ma klasę A+++ w chłodzeniu (SEER 8,5) i A++ w grzaniu (SCOP 4,6).
  - question: Czy klimatyzator Rotenso Fresh jest głośny?
    answer: Nie. Na najniższym biegu wentylatora jednostka wewnętrzna pracuje z głośnością zaledwie 19 dB, więc sprawdza się w sypialni i pokoju dziecka.
  - question: Czy Fresh można podłączyć do systemu multi split?
    answer: Tak. Jednostka wewnętrzna Fresh współpracuje z jednostką zewnętrzną FH26Xo R16 w systemie split oraz z agregatami Hiro N-Line w systemie multi split.
