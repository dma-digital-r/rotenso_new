faq:
  - question: Czym wyróżnia się klimatyzator Rotenso Mirai?
    answer: Rotenso Mirai to nowoczesny klimatyzator ścienny, który łączy wysoką wydajność, energooszczędność i elegancki design. Urządzenie zapewnia skuteczne chłodzenie i ogrzewanie, komfortową pracę oraz zaawansowane funkcje poprawiające jakość powietrza.
  - question: Czy klimatyzator Rotenso Mirai nadaje się do ogrzewania?
    answer: Tak. Mirai ma klasę energetyczną A+++ również w trybie grzania (SCOP 5,3) i pracuje przy temperaturze zewnętrznej nawet do -30°C, dlatego może ogrzewać dom, mieszkanie lub biuro przez cały rok.
  - question: Jaką powierzchnię może obsłużyć klimatyzator Rotenso Mirai?
    answer: Mirai jest dostępny w mocach 2,6 kW i 3,5 kW. Właściwa moc zależy nie tylko od metrażu, ale też od izolacji budynku, nasłonecznienia i liczby osób w pomieszczeniu — dlatego najlepiej dobrać ją razem z instalatorem.
  - question: Czy Rotenso Mirai jest energooszczędny?
    answer: Tak. Mirai ma najwyższą klasę energetyczną A+++ zarówno w chłodzeniu (SEER do 9,3), jak i w grzaniu (SCOP 5,3), co przekłada się na niskie zużycie prądu i niższe rachunki.
  - question: Czy klimatyzator Rotenso Mirai jest głośny?
    answer: Nie. Jednostka wewnętrzna pracuje z głośnością od 21 dB(A) w najcichszym trybie, więc sprawdza się również w sypialni i pokoju dziecka.
