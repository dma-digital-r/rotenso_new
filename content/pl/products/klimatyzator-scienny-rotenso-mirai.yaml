  kicker: Ultra wydajna technologia
  title: |-
    Grzanie nawet przy
    -30°C na zewnątrz
  text: |-
    Rotenso Mirai to klimatyzator, który nie tylko efektywnie chłodzi latem, ale równie skutecznie ogrzewa pomieszczenia zimą. Działa niezawodnie nawet wtedy, gdy na zewnątrz panują mrozy do -30°C. Zapewnia przyjemne ciepło wewnątrz bez dużego zużycia energii i wysokich rachunków.

    To sprawia, że Mirai jest idealnym rozwiązaniem do całorocznego używania w domu, mieszkaniu lub w biurze.
featureSlides:
  - image: /images/products/mirai-slide-1.jpg
    title: Inteligentny czujnik ruchu
    text: Smart Eye Away to inteligentny czujnik, który wykrywa obecność osoby w pomieszczeniu i automatycznie kieruje nawiew powietrza tak, aby nie był skierowany bezpośrednio na nią. Dzięki temu podczas chłodzenia możesz cieszyć się przyjemną temperaturą bez uczucia niekomfortowego podmuchu.
  - image: /images/products/mirai-slide-2.jpg
    title: Jonizator powietrza
    text: Rotenso Mirai wyposażony jest w jonizator powietrza, który oczyszcza powietrze z drobnych zanieczyszczeń, kurzu i alergenów, tworząc zdrowsze środowisko w pomieszczeniu. Dodatkowo jonizacja pomaga utrzymać świeży i przyjemny mikroklimat, zwiększając komfort codziennego użytkowania klimatyzatora.
