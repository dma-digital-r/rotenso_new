    - image: /images/products/mirai-atut-aplikacja.jpg
      title: Sterowanie aplikacją
      text: Wbudowane WiFi pozwala sterować klimatyzatorem z aplikacji w telefonie — włączysz go, zmienisz tryb lub temperaturę, zanim wrócisz do domu.
    - image: /images/products/mirai-atut-filtr.jpg
      title: Filtr antybakteryjny
      text: Filtr antybakteryjny zatrzymuje kurz i drobne zanieczyszczenia, dzięki czemu powietrze w pomieszczeniu jest czystsze i przyjemniejsze.
  grid:
    - image: /images/products/mirai-grid-caloroczny.jpg
      title: Pakiet pracy całorocznej
      text: Grzałki tacy ociekowej i sprężarki chronią jednostkę zewnętrzną przed zamarzaniem, dzięki czemu Mirai może niezawodnie grzać również podczas mrozów.
    - image: /images/products/mirai-grid-cichy.jpg
      title: Tryb super cichy
      text: W trybie super cichym jednostka wewnętrzna pracuje z głośnością od 21 dB(A) — ciszej niż szept, więc nie przeszkadza w pracy ani podczas snu.
    - image: /images/products/mirai-grid-bms.jpg
      title: Smart Home BMS
      text: Klimatyzator można podłączyć do systemów inteligentnego domu i zarządzania budynkiem (BMS), aby sterować nim razem z innymi urządzeniami.
    - image: /images/products/mirai-grid-smart-away.jpg
      title: Funkcja Smart Away
      text: Gdy czujnik nie wykrywa nikogo w pomieszczeniu, klimatyzator automatycznie przechodzi w oszczędny tryb pracy, a po Twoim powrocie wraca do ustawień.
