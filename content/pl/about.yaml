timeline:
  title: A to wszystko zaczęło się od...
  text: Poznaj historię marki Rotenso
  items:
    - year: '2000'
      title: Narodziny Thermosilesia
      text: Na Śląsku rozpoczyna działalność Thermosilesia — firma zajmująca się montażem, serwisem i sprzedażą systemów klimatyzacji RAC i CAC czołowych producentów. To fundament, na którym za 14 lat powstanie Rotenso.
    - year: '2009'
      title: Skromne początki logistyki
      text: Firma dysponuje zaledwie 150 m² powierzchni magazynowej i 80 miejscami paletowymi — punkt wyjścia do dzisiejszego centrum logistycznego o powierzchni ponad 20 000 m².
    - year: '2010'
      title: Start programu marek własnych
      text: Thermosilesia rozpoczyna program produkcji, rozwoju i promocji własnych marek HVAC — strategiczna decyzja, która cztery lata później doprowadzi do powstania Rotenso.
    - year: '2012'
      title: Debiut marki Ferono
      text: Pierwszą marką własną wprowadzoną na rynek są wentylatory i kurtyny powietrzne Ferono — sprawdzenie modelu, który wkrótce zostanie powtórzony przy Rotenso.
    - year: '2014'
      title: Narodziny Rotenso
      text: Na polskim rynku debiutują klimatyzatory Rotenso — flagowa marka Thermosilesia. Od tego momentu firma inwestuje w technologię inwerterową, projektowanie jednostek ściennych, kasetonowych i komercyjnych oraz budowę sieci instalatorów.
    - year: 2015 – 2018
      title: Rozbudowa portfela marek
      text: 'Kolejno powstają: Tivento (rury miedziane w otulinie), Swedo (pompki skroplin), Ivensis (akcesoria montażowe) i Cleanairix (profesjonalna chemia serwisowa). W 2018 roku zespół Thermosilesia liczy już 47 osób.'
    - year: '2019'
      title: Nowe centrum logistyczne
      text: Po przeprowadzce do Rudy Śląskiej powierzchnia centrum logistycznego Thermosilesia rośnie do 4 300 m², a liczba miejsc paletowych — do 6 700. Rotenso zyskuje realne zaplecze do skalowania sprzedaży.
    - year: 2020 – 2022
      title: Od klimatyzacji do pełnego HVAC
      text: 'Oferta Rotenso wykracza poza klimatyzatory ścienne: pojawiają się pompy ciepła powietrze-woda (Aquami, Airmi, Windmi, Heatmi), rozbudowane systemy komercyjne oraz jednostki VRF/RVF. Urządzenia pracują na ekologicznym czynniku R32.'
    - year: '2023'
      title: Sieć partnerska rośnie
      text: Rotenso rozbudowuje sieć autoryzowanych instalatorów i serwisu w Polsce i Europie, poszerza katalog klimatyzatorów ściennych (m.in. serie Versu, Mirai, Elis, Ukura, Imoto) i prowadzi regularne szkolenia techniczne dla branży instalacyjnej.
    - year: '2024'
      title: Wentilo ICON i 24-lecie Thermosilesia
      text: Na targach MCE w Mediolanie Rotenso prezentuje zupełnie nową linię rekuperatorów Wentilo ICON. Thermosilesia świętuje 24-lecie działalności, zespół liczy już 188 osób, a firma zostaje uhonorowana Diamentem Forbesa za dynamikę rozwoju.
    - year: '2025'
      title: Warsaw HVAC Expo i nowe centrum
      text: Rotenso prezentuje nowości na Warsaw HVAC Expo. W Rudzie Śląskiej rusza budowa jednej z największych inwestycji w historii firmy — nowego centrum logistycznego o powierzchni ponad 17 000 m².
    - year: '2026'
      title: Rotenso dziś
      text: Centrum logistyczne osiąga ponad 20 000 m² i 29 000 miejsc paletowych. Rotenso wprowadza nowy katalog systemów RVF na sezon 2026/27 oraz kolejne serie klimatyzatorów (m.in. Luve, Teta, Roni, Fresh) i jest obecne na rynkach Polski, Niemiec, Francji, Czech, Włoch i Ukrainy.
