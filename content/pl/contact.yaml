form:
  title: Formularz kontaktowy
  text: Czego dotyczy Twoja wiadomość?
  topic: Wybierz temat / dział*
  topics:
    - Pytanie o produkt
    - Pomoc techniczna / serwis
    - Gwarancja i reklamacje
    - Współpraca i instalatorzy
    - Inwestycje i systemy RVF
    - Inne
  name: Imię i Nazwisko*
  email: Adres e-mail*
  phone: Nr telefonu
  postcode: Kod pocztowy
  message: Wiadomość...
  consent: Wyrażam zgodę na przetwarzanie moich danych osobowych...
  consentFull: 'Administratorem Pani/Pana danych osobowych jest Thermosilesia sp. z o. o. sp. k. Pani/Pana dane zbierane są w celu udzielenia odpowiedzi na zapytanie przesłane za pomocą formularza kontaktowego. Ma Pani/Pana prawo dostępu do swoich danych osobowych, prawo do żądania poprawienia, usunięcia lub ograniczenia przetwarzania tych danych, prawo do przenoszenia danych, odwołania zgody, wyrażenia sprzeciwu. Szczegóły dotyczące przetwarzania dostępne są na stronie: https://rotenso.com/pl/ w zakładce „RODO”.'
  consentMore:
    label: Dowiedz się więcej
    href: /pl/rodo
  privacy:
    label: Sprawdź, jak przetwarzamy Twoje dane.
    href: /pl/rodo
  required: '*pola wymagane'
  submit: Wyślij wiadomość
  success: Dziękujemy! Twoja wiadomość została wysłana — odpowiemy najszybciej, jak to możliwe.
  error: Nie udało się wysłać wiadomości. Spróbuj ponownie za chwilę albo zadzwoń do nas.
