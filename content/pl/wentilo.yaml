faq:
  - question: Czym jest rekuperacja i jak działa system Rotenso Wentilo?
    answer: Rekuperacja to nowoczesny system wentylacji mechanicznej z odzyskiem ciepła. Rekuperator Rotenso Wentilo usuwa zużyte powietrze z pomieszczeń i jednocześnie nawiewa świeże, odzyskując ciepło z powietrza wywiewanego. Dzięki temu w domu jest stały dopływ świeżego powietrza bez strat energii.
  - question: Jakie korzyści daje rekuperacja w domu jednorodzinnym?
    answer: Stały dopływ świeżego, przefiltrowanego powietrza, niższe koszty ogrzewania dzięki odzyskowi ciepła, mniej kurzu, pyłków i smogu w domu oraz ochrona przed nadmiarem wilgoci i pleśnią — bez potrzeby otwierania okien.
  - question: Ile kosztuje rekuperacja Rotenso Wentilo?
    answer: Koszt zależy od wielkości domu, wybranego modelu i systemu dystrybucji powietrza. Zostaw kontakt w formularzu wyceny — instalator z Twojej okolicy przygotuje ofertę dopasowaną do budynku.
  - question: Czy rekuperator Rotenso Wentilo zużywa dużo prądu?
    answer: Nie. Rekuperatory Wentilo mają energooszczędne wentylatory EC, a automatyka dopasowuje ich pracę do potrzeb. Energia zaoszczędzona na ogrzewaniu wielokrotnie przewyższa zużycie prądu przez urządzenie.
  - question: Jak często należy wymieniać filtry w rekuperatorze Rotenso Wentilo?
    answer: Zwykle co 3–6 miesięcy, zależnie od zanieczyszczenia powietrza w okolicy. Rekuperatory z funkcją SMART same informują, który filtr trzeba wymienić.
