control:
  background: /images/wentilo/control-bg.avif
  title: Systemy sterowania
  text: Poznaj dwa systemy sterowania rekuperatorami Wentilo i dowiedz się, czym różnią się między sobą.
  items:
    - icon: /images/wentilo/control-standard.avif
      title: System standardowy
      text: System iEDGE pozwala na wygodne sterowanie rekuperatorem oraz ręczną regulację parametrów pracy, a dodatkowo umożliwia kontrolę przez aplikację mobilną.
    - icon: /images/wentilo/control-smart.avif
      title: System inteligentny
      text: System iEDGE Smart wykorzystuje inteligentne algorytmy, które automatycznie dostosowują pracę wentylacji do warunków w pomieszczeniu, optymalizując komfort i oszczędność energii bez potrzeby ręcznych ustawień.
  note: Poznaj różnice w sposobie sterowania, monitorowania i funkcjonowania rekuperatora w zależności od wybranego systemu sterowania.
  button:
    label: Zobacz różnice
    href: ''
  compare:
    title: |-
      Różnice w sposobie sterowania, monitorowania i funkcjonowania
      rekuperatora w zależności od wybranego systemu sterowania.
    standardHead: |-
      iEDGE
      System standardowy
    smartHead: |-
      iEDGE SMART
      System inteligentny
    rows:
      - label: Intensywność wentylacji
        standardTitle: Tryb ręczny / Harmonogram.
        standardText: |-
          Użytkownik ustawia ręcznie bieg wentylatora na stałe
          lub według harmonogramu.
        smartTitle: Tryb Auto
        smartText: System sterowania kontroluje jakość powietrza i w zależności od poziomu CO2 i wilgotności w twojej przestrzeni automatycznie dostosowuje intensywność wentylacji
      - label: Kontrola jakości powietrza
        standardTitle: Brak
        standardText: ''
        smartTitle: iSENSOR
        smartText: Pomiar, wyświetlanie poziomu CO2 oraz wilgotności
      - label: Sprawdzenie stanu zabrudzenia filtrów
        standardTitle: Brak
        standardText: |-
          Wskazanie poprzez odliczanie czasowe 90 dni
          od dnia ostatniej wymiany filtrów
        smartTitle: iPURE
        smartText: |-
          Automatyczne monitorowanie stanu zabrudzenia filtrów
          i wyświetlanie procentowej wartości ich zużycia
      - label: Bilansowanie strumieni powietrza
        standardTitle: Brak
        standardText: ''
        smartTitle: iBALANCE
        smartText: |-
          Równoważy wentylację eliminując problem podciśnienia
          i nadciśnienia
      - label: Zapewnienie stałe maksymalnej sprawności odzysku ciepła
        standardTitle: Brak
        standardText: ''
        smartTitle: iBALANCE
        smartText: |-
          Stabilizując i bilansując strumienie zapewnia stały
          i maksymalny odzysk ciepła
      - label: Czujnik CO₂
        standardTitle: Brak
        standardText: ''
