about:
  background: /images/wentilo/about-bg.avif
  title: Co to jest rekuperacja?
  boxTitle: Rekuperacja
  boxSubtitle: |-
    to inteligentny system
    wentylacji mechanicznej,
  boxText: |-
    który stale dostarcza świeże powietrze do domu, jednocześnie odzyskując ciepło z powietrza wywiewanego. System zapewnia komfort, zdrowe powietrze i niższe rachunki za energię, niezależnie od pory roku.

    Instalacja składa się z centrali wentylacyjnej Rotenso Wentilo ICON oraz systemu dystrybucji powietrza.
  image: /images/wentilo/about-video.avif
  video: ''
mechanical:
  title: Wentylacja mechaniczna
  text: Poznaj zalety wentylacji mechanicznej w porównaniu do tradycyjnej wentylacji grawitacyjnej.
  items:
    - image: /images/wentilo/mech-komfort.avif
      title: |-
        Komfort przez
        cały rok
      text: Wentylacja mechaniczna zapewnia stałą wymianę powietrza niezależnie od pory roku, temperatury czy warunków atmosferycznych. W przeciwieństwie do wentylacji grawitacyjnej działa zawsze z taką samą skutecznością, eliminując problem niedowietrzonych pomieszczeń. Dzięki odzyskowi ciepła ogranicza straty energii, utrzymując stabilną temperaturę wewnątrz budynku.
    - image: /images/wentilo/mech-powietrze.avif
      title: |-
        Czyste powietrze
        pod kontrolą
      text: System wentylacji mechanicznej aktywnie usuwa zanieczyszczenia, nadmiar wilgoci i nieprzyjemne zapachy, jednocześnie filtrując powietrze nawiewane z zewnątrz. Chroni wnętrza przed smogiem, pyłkami i alergenami, czego wentylacja grawitacyjna nie jest w stanie zapewnić. Efektem jest zdrowsze powietrze i większy komfort oddychania dla domowników.
    - image: /images/wentilo/mech-oszczednosc.avif
      title: |-
        Oszczędność,
        którą czuć
      text: Dzięki precyzyjnie sterowanej pracy i odzyskowi ciepła wentylacja mechaniczna realnie obniża koszty ogrzewania budynku. Minimalizuje straty energii, które w systemach grawitacyjnych uciekają bez kontroli przez kanały wentylacyjne. To rozwiązanie, które przekłada się na niższe rachunki i szybszy zwrot z inwestycji.
icon:
  background: /images/wentilo/icon-bg.avif
  title: Rekuperatory Rotenso Wentilo ICON
  text: Dzięki rekuperacji Twój dom może oddychać świeżym i zdrowym powietrzem przy jednoczesnej oszczędności energii. Odkryj rodzinę rekuperatorów Wentilo i wybierz idealny model dla siebie, łączący komfort, innowacyjne sterowanie i niezawodną wydajność.
  slides:
    - image: /images/wentilo/icon-antysmog.avif
      video: ''
      title: Działanie antysmogowe
      text: Rekuperatory Wentilo z 4-etapowym systemem filtracji skutecznie oczyszczają nawiewane powietrze, usuwając pyłki, kurz, alergeny oraz zanieczyszczenia smogowe zanim trafią do domu. Dzięki temu w pomieszczeniach oddychasz zdrowszym, czystszym powietrzem — nawet w miejscach o wysokim poziomie zanieczyszczeń.
    - image: /images/wentilo/icon-antybakteryjna.avif
      video: ''
      title: Powłoka antybakteryjna
      text: Specjalna powłoka antybakteryjna w rekuperatorach Wentilo ogranicza rozwój bakterii i drobnoustrojów wewnątrz urządzenia. Dzięki temu powietrze dostarczane do domu jest nie tylko świeże, ale też bezpieczniejsze dla zdrowia domowników.
recovery:
  background: /images/wentilo/recovery-bg.avif
  title: Odzysk ciepła i wilgoci
  text: Wybierz wymiennik z odzyskiem ciepła lub odzyskiem ciepła i wilgoci
  tabs:
    - label: Odzysk ciepła
      title: Odzysk ciepła
      image: /images/wentilo/recovery-cieplo.avif
      text: |-
        iENERGY to wymiennik, który pozwala odzyskać ciepło z powietrza usuwanego z domu i wykorzystać je do ogrzania świeżego, nawiewanego z zewnątrz. Dzięki temu w budynku utrzymasz optymalną temperaturę, a rachunki za ogrzewanie mogą być niższe. System działa cicho i wydajnie, a automatyka sterująca dostosowuje pracę rekuperacji do aktualnych potrzeb.

        To idealne wsparcie dla domowego ogrzewania, które pomaga utrzymać stały komfort przez cały okres grzewczy.
    - label: Odzysk ciepła i wilgoci
      title: Odzysk ciepła i wilgoci
      image: /images/wentilo/recovery-cieplo.avif
      text: Wymiennik entalpiczny odzyskuje nie tylko ciepło, ale też część wilgoci z powietrza wywiewanego. Zimą chroni dom przed przesuszonym powietrzem, a latem ogranicza napływ wilgoci z zewnątrz — dzięki temu wilgotność w pomieszczeniach pozostaje na komfortowym poziomie przez cały rok.
