seoTitle: Rotenso — Klimaanlagen, Wohnraumlüftung, Wärmepumpen
seoDescription: Innovative HLK-Systeme für Zuhause und Unternehmen — Klimaanlagen, Lüftungsgeräte mit Wärmerückgewinnung, Wärmepumpen und RVF / VRF-Systeme.
heroSlides:
  - tab: Klimaanlagen
    title: Klimaanlagen
    text: Rotenso bietet eine große Auswahl an Klimasystemen, die das ganze Jahr über für die ideale Temperatur sorgen.
    primary:
      label: Modelle entdecken
      href: /de/klimatyzacja
    secondary:
      label: Neuheiten ansehen
      href: /de/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: Wohnraumlüftung
    title: Wohnraumlüftung
    text: Ständig frische, gefilterte Luft mit Wärme- oder Feuchterückgewinnung.
    primary:
      label: Modelle entdecken
      href: /de/rekuperacja
    secondary:
      label: Neuheiten ansehen
      href: /de/rekuperacja
    background: null
  - tab: Wärmepumpen
    title: Wärmepumpen
    text: Wirtschaftliches, wartungsfreies Heizen von Gebäuden und Warmwasserbereitung.
    primary:
      label: Modelle entdecken
      href: /de/pompy-ciepla
    secondary:
      label: Neuheiten ansehen
      href: /de/pompy-ciepla
    background: null
  - tab: RVF-Systeme
    title: RVF-Systeme
    text: Präzise Temperaturregelung in vielen Zonen gleichzeitig — für Büros, Hotels und Gewerbeobjekte.
    primary:
      label: Modelle entdecken
      href: /de/systemy-rvf
    secondary:
      label: Neuheiten ansehen
      href: /de/systemy-rvf
    background: null
idea:
  title: Rotenso Klimaanlagen — Komfort, den Sie vom ersten Moment an spüren.
  text: Sie kühlen, heizen und reinigen die Luft — und Ihr Zuhause wird zur Wohlfühloase. Elegantes Design und leiser Betrieb machen die Geräte zu einem natürlichen Teil des Raumes. Die Bedienung ist einfach und intuitiv, sodass Entspannung immer greifbar ist.
