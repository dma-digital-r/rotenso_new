wentilo:
  title: Frische Luft dank Wärmerückgewinnung
  productName: Wentilo ICON
  text: |-
    Rotenso Wentilo Lüftungsgeräte sorgen für ständig frische, gefilterte Luft mit Wärme- oder Feuchterückgewinnung und senken gleichzeitig die Heizkosten. Die intelligente Steuerung garantiert Ihnen den ganzen Tag Komfort ohne zusätzlichen Aufwand.

    Entdecken Sie die Rotenso Wentilo ICON Serie und wählen Sie die passende Lösung für Ihr Zuhause.
  cta:
    label: Wentilo ICON entdecken
    href: /de/rekuperacja/wentilo-icon
  configurator:
    question: Sie wissen nicht, welches Lüftungsgerät passt?
    cta: Nutzen Sie den Konfigurator
    href: /de/doboromierz/rekuperacja
  background: /images/home/wentilo-bg.png
  media: /images/home/wentilo-media.png
  video: ''
