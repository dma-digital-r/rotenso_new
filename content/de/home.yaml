seo:
  title: Rotenso
  subtitle: Innovative HLK-Systeme für Zuhause und Unternehmen
  text: |-
    Wir sind ein polnisches Unternehmen, das sich auf Klimaanlagen, Wohnraumlüftung, Wärmepumpen und fortschrittliche Klimasysteme (RVF) spezialisiert hat. Unsere Produkte sind auf die Bedürfnisse von Privat- und Geschäftskunden zugeschnitten. Wir setzen auf Technologien, die Komfort, saubere Luft und echte Einsparungen bieten.

    Dank ständiger Weiterentwicklung und eines wachsenden Produktkatalogs gewinnt die Marke Anerkennung bei Nutzern und Partnern in ganz Europa und bietet Lösungen für individuelle Anforderungen und verschiedene Gebäudetypen. Rotenso steht für Effizienz, Innovation und modernes Design — das macht unsere Geräte zur ausgezeichneten Wahl für alle, die Qualität für viele Jahre suchen.
  background: /images/home/seo-bg.png
