form:
  title: Kontaktformular
  text: Worum geht es in Ihrer Nachricht?
  topic: Thema / Abteilung wählen*
  topics:
    - Frage zum Produkt
    - Technischer Support / Service
    - Garantie und Reklamationen
    - Zusammenarbeit und Installateure
    - Investitionen und RVF-Systeme
    - Sonstiges
  name: Vor- und Nachname*
  email: E-Mail-Adresse*
  phone: Telefonnummer
  postcode: Postleitzahl
  message: Nachricht...
  consent: Ich willige in die Verarbeitung meiner personenbezogenen Daten ein...
  consentFull: Verantwortlicher für Ihre personenbezogenen Daten ist Thermosilesia sp. z o. o. sp. k. Ihre Daten werden erhoben, um die über das Kontaktformular gesendete Anfrage zu beantworten. Sie haben das Recht auf Auskunft über Ihre Daten, auf Berichtigung, Löschung oder Einschränkung der Verarbeitung, auf Datenübertragbarkeit, auf Widerruf der Einwilligung und auf Widerspruch. Einzelheiten zur Verarbeitung finden Sie unter https://rotenso.com/pl/ im Bereich „DSGVO“.
  consentMore:
    label: Mehr erfahren
    href: /de/rodo
  privacy:
    label: So verarbeiten wir Ihre Daten.
    href: /de/rodo
  required: '*Pflichtfelder'
  submit: Nachricht senden
  success: Vielen Dank! Ihre Nachricht wurde gesendet — wir antworten so schnell wie möglich.
  error: Die Nachricht konnte nicht gesendet werden. Bitte versuchen Sie es gleich noch einmal oder rufen Sie uns an.
