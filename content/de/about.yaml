timeline:
  title: Und alles begann mit...
  text: Entdecken Sie die Geschichte der Marke Rotenso
  items:
    - year: '2000'
      title: Die Gründung von Thermosilesia
      text: In Schlesien nimmt Thermosilesia seine Tätigkeit auf — ein Unternehmen für Montage, Service und Vertrieb von RAC- und CAC-Klimasystemen führender Hersteller. Das Fundament, auf dem 14 Jahre später Rotenso entsteht.
    - year: '2009'
      title: Bescheidene Anfänge in der Logistik
      text: Das Unternehmen verfügt über gerade einmal 150 m² Lagerfläche und 80 Palettenplätze — der Ausgangspunkt für das heutige Logistikzentrum mit über 20.000 m².
    - year: '2010'
      title: Start des Eigenmarkenprogramms
      text: Thermosilesia startet ein Programm zur Produktion, Entwicklung und Vermarktung eigener HVAC-Marken — eine strategische Entscheidung, die vier Jahre später zur Gründung von Rotenso führt.
    - year: '2012'
      title: Debüt der Marke Ferono
      text: Die erste Eigenmarke am Markt sind Ventilatoren und Luftschleier von Ferono — ein Test des Modells, das bald mit Rotenso wiederholt wird.
    - year: '2014'
      title: Die Geburt von Rotenso
      text: Auf dem polnischen Markt debütieren die Klimaanlagen von Rotenso — der Hauptmarke von Thermosilesia. Ab jetzt investiert das Unternehmen in Invertertechnik, die Entwicklung von Wand-, Kassetten- und Gewerbegeräten sowie in ein Installateurnetz.
    - year: 2015 – 2018
      title: Ausbau des Markenportfolios
      text: Nacheinander entstehen Tivento (isolierte Kupferrohre), Swedo (Kondensatpumpen), Ivensis (Montagezubehör) und Cleanairix (professionelle Servicechemie). 2018 zählt das Team von Thermosilesia bereits 47 Personen.
    - year: '2019'
      title: Neues Logistikzentrum
      text: Nach dem Umzug nach Ruda Śląska wächst das Logistikzentrum von Thermosilesia auf 4.300 m² und die Zahl der Palettenplätze auf 6.700. Rotenso erhält echte Kapazitäten für mehr Absatz.
    - year: 2020 – 2022
      title: Von der Klimaanlage zum kompletten HVAC
      text: 'Das Angebot von Rotenso geht über Wandklimageräte hinaus: Es kommen Luft-Wasser-Wärmepumpen (Aquami, Airmi, Windmi, Heatmi), erweiterte Gewerbesysteme und VRF/RVF-Geräte hinzu. Die Geräte arbeiten mit dem umweltfreundlichen Kältemittel R32.'
    - year: '2023'
      title: Das Partnernetz wächst
      text: Rotenso baut sein Netz autorisierter Installateure und Servicepartner in Polen und Europa aus, erweitert das Angebot an Wandklimageräten (u. a. Serien Versu, Mirai, Elis, Ukura, Imoto) und bietet regelmäßige technische Schulungen für die Installationsbranche.
    - year: '2024'
      title: Wentilo ICON und 24 Jahre Thermosilesia
      text: Auf der MCE in Mailand stellt Rotenso die völlig neue Lüftungsgeräte-Linie Wentilo ICON vor. Thermosilesia feiert 24 Jahre, das Team zählt 188 Personen und das Unternehmen erhält den Forbes-Diamanten für sein dynamisches Wachstum.
    - year: '2025'
      title: Warsaw HVAC Expo und neues Zentrum
      text: Rotenso präsentiert Neuheiten auf der Warsaw HVAC Expo. In Ruda Śląska beginnt der Bau einer der größten Investitionen der Firmengeschichte — eines neuen Logistikzentrums mit über 17.000 m².
    - year: '2026'
      title: Rotenso heute
      text: Das Logistikzentrum erreicht über 20.000 m² und 29.000 Palettenplätze. Rotenso bringt einen neuen RVF-Katalog für die Saison 2026/27 und weitere Klimagerätereihen (u. a. Luve, Teta, Roni, Fresh) heraus und ist in Polen, Deutschland, Frankreich, Tschechien, Italien und der Ukraine vertreten.
