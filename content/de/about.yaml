company:
  background: /images/about/company-bg.jpg
  title: Ein polnisches Unternehmen mit globaler Vision
  text: |-
    Rotenso ist vom ersten Tag an eine polnische Marke. Wir sind kein Vertrieb eines ausländischen Herstellers — wir entwickeln unsere Produkte für das polnische Klima, polnische Häuser und polnische Einsatzbedingungen.

    Wir verbinden lokales Ingenieurwissen mit moderner Technologie und bieten Lösungen, die mit den weltweiten Branchenführern vergleichbar sind — zu einem wettbewerbsfähigen Preis und mit lokalem Service in ganz Polen.
