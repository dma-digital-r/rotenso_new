why:
  title: Warum Filter wechseln?
  text: Einige Gründe, die Filter regelmäßig zu wechseln
  items:
    - image: /images/filters/why-powietrze.avif
      title: Gesunde, saubere Luft
      text: Ein verschmutzter Filter hält Staub, Pollen, Smog und Außenluftverschmutzung nicht mehr zurück. Ein alter Filter kann zudem zum Nährboden für Bakterien und Pilze werden, die direkt ins Haus geblasen werden.
    - image: /images/filters/why-wilgoc.avif
      title: Schutz vor Feuchtigkeit
      text: Verstopfte Filter behindern den Luftstrom, die Luft wird stickig. Feuchtigkeit fördert Schimmel an den Wänden. Ein sauberer Filter führt Wasserdampf wirksam ab und verhindert z. B. beschlagene Fenster.
    - image: /images/filters/why-zywotnosc.avif
      title: Längere Lebensdauer des Geräts
      text: Filter schützen nicht nur Ihre Lunge, sondern auch das Herz des Geräts – den Wärmetauscher. Gelangt Schmutz tiefer, sinkt die Wärmerückgewinnung, das Gerät wird lauter und es droht ein teurer Defekt.
