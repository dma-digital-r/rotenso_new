seoTitle: Rotenso — climatizzazione, VMC, pompe di calore
seoDescription: Sistemi HVAC innovativi per la casa e l’azienda — climatizzatori, unità VMC con recupero di calore, pompe di calore e sistemi RVF / VRF.
heroSlides:
  - tab: Climatizzatori
    title: Climatizzatori
    text: Rotenso offre un’ampia gamma di sistemi di climatizzazione che garantiscono la temperatura ideale tutto l’anno.
    primary:
      label: Scopri i modelli
      href: /it/klimatyzacja
    secondary:
      label: Scopri le novità
      href: /it/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: VMC
    title: VMC
    text: Un apporto costante di aria fresca e filtrata con recupero di calore o di umidità.
    primary:
      label: Scopri i modelli
      href: /it/rekuperacja
    secondary:
      label: Scopri le novità
      href: /it/rekuperacja
    background: null
  - tab: Pompe di calore
    title: Pompe di calore
    text: Riscaldamento economico e senza manutenzione degli edifici e produzione di acqua calda sanitaria.
    primary:
      label: Scopri i modelli
      href: /it/pompy-ciepla
    secondary:
      label: Scopri le novità
      href: /it/pompy-ciepla
    background: null
  - tab: Sistemi RVF
    title: Sistemi RVF
    text: Controllo preciso della temperatura in più zone contemporaneamente — per uffici, hotel ed edifici commerciali.
    primary:
      label: Scopri i modelli
      href: /it/systemy-rvf
    secondary:
      label: Scopri le novità
      href: /it/systemy-rvf
    background: null
idea:
  title: La climatizzazione Rotenso è un comfort che senti fin dal primo istante.
  text: Raffresca, riscalda e purifica l’aria, trasformando la tua casa in un rifugio. Il design elegante e il funzionamento silenzioso rendono le unità parte naturale dell’arredamento. Il controllo è semplice e intuitivo, così la tranquillità è sempre a portata di mano.
  background: /images/home/idea-bg.png
