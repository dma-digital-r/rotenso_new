seo:
  title: Rotenso
  subtitle: Sistemi HVAC innovativi per la casa e l’azienda
  text: |-
    Siamo un’azienda polacca specializzata in climatizzazione, VMC, pompe di calore e sistemi di climatizzazione avanzati (RVF). I nostri prodotti sono adatti alle esigenze di clienti privati e aziendali. Puntiamo su tecnologie che offrono comfort, aria pulita e un risparmio reale.

    Grazie al continuo sviluppo e all’ampliamento del catalogo, il marchio ottiene il riconoscimento di utenti e partner in tutta Europa, offrendo soluzioni su misura per esigenze individuali e diversi tipi di edifici. Rotenso è sinonimo di efficienza, innovazione e design moderno, e questo rende le nostre unità una scelta eccellente per chi cerca qualità duratura.
  background: /images/home/seo-bg.png
