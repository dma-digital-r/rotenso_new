why:
  title: Perché sostituire i filtri?
  text: Alcuni motivi per sostituire regolarmente i filtri
  items:
    - image: /images/filters/why-powietrze.avif
      title: Aria sana e pulita
      text: Un filtro sporco non trattiene più polvere, pollini, smog e inquinamento esterno. Un filtro vecchio può anche diventare un focolaio di batteri e muffe soffiati direttamente in casa.
    - image: /images/filters/why-wilgoc.avif
      title: Protezione dall’umidità
      text: I filtri intasati ostacolano il flusso d’aria e l’aria diventa viziata. L’umidità favorisce la muffa sulle pareti. Un filtro pulito rimuove efficacemente il vapore acqueo ed evita ad esempio la condensa sui vetri.
    - image: /images/filters/why-zywotnosc.avif
      title: Maggiore durata dell’unità
      text: 'I filtri proteggono non solo i tuoi polmoni ma anche il cuore dell’unità: lo scambiatore. Se lo sporco penetra, il recupero di calore cala, l’unità diventa rumorosa e può arrivare un guasto costoso.'
