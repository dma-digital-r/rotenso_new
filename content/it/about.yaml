timeline:
  title: E tutto è iniziato con...
  text: Scopri la storia del marchio Rotenso
  items:
    - year: '2000'
      title: Nasce Thermosilesia
      text: In Slesia inizia l’attività di Thermosilesia — un’azienda che installa, assiste e vende sistemi di climatizzazione RAC e CAC dei principali produttori. È la base su cui 14 anni dopo nascerà Rotenso.
    - year: '2009'
      title: Modesti inizi nella logistica
      text: L’azienda dispone di appena 150 m² di magazzino e 80 posti pallet — il punto di partenza per l’attuale centro logistico di oltre 20.000 m².
    - year: '2010'
      title: Avvio del programma di marchi propri
      text: Thermosilesia avvia un programma di produzione, sviluppo e promozione di marchi HVAC propri — una decisione strategica che quattro anni dopo porterà alla nascita di Rotenso.
    - year: '2012'
      title: Debutto del marchio Ferono
      text: Il primo marchio proprio sul mercato sono i ventilatori e le barriere d’aria Ferono — una prova del modello che sarà presto ripetuto con Rotenso.
    - year: '2014'
      title: Nasce Rotenso
      text: Sul mercato polacco debuttano i climatizzatori Rotenso, marchio di punta di Thermosilesia. Da allora l’azienda investe nella tecnologia inverter, nella progettazione di unità a parete, a cassetta e commerciali e nella costruzione di una rete di installatori.
    - year: 2015 – 2018
      title: L’ampliamento del portafoglio marchi
      text: Nascono via via Tivento (tubi in rame isolati), Swedo (pompe per condensa), Ivensis (accessori di montaggio) e Cleanairix (chimica professionale per l’assistenza). Nel 2018 il team di Thermosilesia conta già 47 persone.
    - year: '2019'
      title: Un nuovo centro logistico
      text: Dopo il trasferimento a Ruda Śląska il centro logistico di Thermosilesia cresce a 4.300 m² e i posti pallet a 6.700. Rotenso ottiene una base reale per far crescere le vendite.
    - year: 2020 – 2022
      title: Dalla climatizzazione all’HVAC completo
      text: 'L’offerta Rotenso va oltre i climatizzatori a parete: arrivano le pompe di calore aria-acqua (Aquami, Airmi, Windmi, Heatmi), sistemi commerciali ampliati e unità VRF/RVF. Gli apparecchi funzionano con il refrigerante ecologico R32.'
    - year: '2023'
      title: La rete dei partner cresce
      text: Rotenso amplia la rete di installatori e centri assistenza autorizzati in Polonia e in Europa, arricchisce la gamma di climatizzatori a parete (tra cui le serie Versu, Mirai, Elis, Ukura, Imoto) e organizza regolarmente corsi tecnici per il settore.
    - year: '2024'
      title: Wentilo ICON e i 24 anni di Thermosilesia
      text: Alla fiera MCE di Milano Rotenso presenta la nuovissima linea di recuperatori Wentilo ICON. Thermosilesia festeggia 24 anni di attività, il team conta 188 persone e l’azienda riceve il Diamante Forbes per la sua crescita dinamica.
    - year: '2025'
      title: Warsaw HVAC Expo e un nuovo centro
      text: Rotenso presenta le novità al Warsaw HVAC Expo. A Ruda Śląska parte la costruzione di uno dei maggiori investimenti della storia aziendale — un nuovo centro logistico di oltre 17.000 m².
    - year: '2026'
      title: Rotenso oggi
      text: Il centro logistico supera i 20.000 m² e i 29.000 posti pallet. Rotenso lancia un nuovo catalogo di sistemi RVF per la stagione 2026/27 e nuove serie di climatizzatori (tra cui Luve, Teta, Roni, Fresh) ed è presente in Polonia, Germania, Francia, Cechia, Italia e Ucraina.
