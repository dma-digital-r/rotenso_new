company:
  background: /images/about/company-bg.jpg
  title: Un’azienda polacca con una visione globale
  text: |-
    Rotenso è un marchio polacco fin dal primo giorno. Non siamo il distributore di un produttore straniero — progettiamo i nostri prodotti pensando al clima, alle case e alle condizioni d’uso polacche.

    Uniamo il know-how ingegneristico locale alle tecnologie moderne, offrendo soluzioni paragonabili a quelle dei leader mondiali del settore — a un prezzo competitivo e con un’assistenza locale in tutta la Polonia.
