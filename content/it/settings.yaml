splitVsMulti:
  title: Split o multi-split?
  split:
    image: /images/products/split-system.jpg
    title: Sistema split
    text: Il tipo di climatizzazione più semplice e scelto per casa o appartamento. È composto da un’unità all’interno della stanza (di solito a parete) e da un’unità all’esterno dell’edificio. È la soluzione ideale se vuoi garantire il comfort in una stanza specifica, ad es. il soggiorno o la camera da letto.
  multi:
    image: /images/products/multi-split-system.jpg
    title: Sistema multi-split
    text: Una buona scelta se vuoi climatizzare più stanze contemporaneamente ma non puoi o non vuoi montare più unità esterne sulla facciata. All’esterno viene installata una sola unità che serve più climatizzatori interni. L’insieme è esteticamente curato e occupa poco spazio.
