form:
  title: Modulo di contatto
  text: Di cosa tratta il tuo messaggio?
  topic: Scegli argomento / reparto*
  topics:
    - Domanda su un prodotto
    - Assistenza tecnica / servizio
    - Garanzia e reclami
    - Collaborazione e installatori
    - Investimenti e sistemi RVF
    - Altro
  name: Nome e cognome*
  email: Indirizzo e-mail*
  phone: Telefono
  postcode: CAP
  message: Messaggio...
  consent: Acconsento al trattamento dei miei dati personali...
  consentFull: Il titolare del trattamento dei tuoi dati personali è Thermosilesia sp. z o. o. sp. k. I dati sono raccolti per rispondere alla richiesta inviata tramite il modulo di contatto. Hai diritto di accesso ai tuoi dati, di rettifica, cancellazione o limitazione del trattamento, alla portabilità, di revocare il consenso e di opporti. I dettagli sul trattamento sono disponibili su https://rotenso.com/pl/ nella sezione «GDPR».
  consentMore:
    label: Scopri di più
    href: /it/rodo
  privacy:
    label: Scopri come trattiamo i tuoi dati.
    href: /it/rodo
  required: '*campi obbligatori'
  submit: Invia messaggio
  success: Grazie! Il tuo messaggio è stato inviato — ti risponderemo il prima possibile.
  error: Non è stato possibile inviare il messaggio. Riprova tra poco o chiamaci.
