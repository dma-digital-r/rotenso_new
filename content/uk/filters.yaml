why:
  title: Навіщо міняти фільтри?
  text: Кілька причин регулярно міняти фільтри
  items:
    - image: /images/filters/why-powietrze.avif
      title: Здорове й чисте повітря
      text: Брудний фільтр перестає затримувати пил, пилок, смог і зовнішні забруднення. Старий фільтр також може стати осередком бактерій і грибків, які потрапляють просто у ваш дім.
    - image: /images/filters/why-wilgoc.avif
      title: Захист від вологи
      text: Забиті фільтри блокують потік повітря, з’являється задуха. Волога сприяє появі плісняви на стінах. Чистий фільтр ефективно виводить водяну пару й запобігає запотіванню вікон.
    - image: /images/filters/why-zywotnosc.avif
      title: Довший термін служби
      text: Фільтри захищають не лише ваші легені, а й серце рекуператора – теплообмінник. Якщо бруд потрапить глибше, ефективність знизиться, робота стане гучнішою, а згодом можлива дорога поломка.
