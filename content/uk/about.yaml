timeline:
  title: А все почалося з...
  text: Дізнайтеся історію бренду Rotenso
  items:
    - year: '2000'
      title: Народження Thermosilesia
      text: У Сілезії починає діяльність Thermosilesia — компанія, що займається монтажем, сервісом і продажем систем кондиціонування RAC і CAC провідних виробників. Це фундамент, на якому через 14 років постане Rotenso.
    - year: '2009'
      title: Скромні початки логістики
      text: Компанія має лише 150 м² складської площі та 80 палетомісць — відправна точка для сучасного логістичного центру площею понад 20 000 м².
    - year: '2010'
      title: Старт програми власних брендів
      text: Thermosilesia запускає програму виробництва, розвитку й просування власних брендів HVAC — стратегічне рішення, яке за чотири роки приведе до появи Rotenso.
    - year: '2012'
      title: Дебют бренду Ferono
      text: Першим власним брендом на ринку стають вентилятори й повітряні завіси Ferono — перевірка моделі, яку невдовзі повторять із Rotenso.
    - year: '2014'
      title: Народження Rotenso
      text: На польському ринку дебютують кондиціонери Rotenso — флагманський бренд Thermosilesia. Відтоді компанія інвестує в інверторні технології, розробку настінних, касетних і комерційних блоків та побудову мережі монтажників.
    - year: 2015 – 2018
      title: Розширення портфеля брендів
      text: Поступово з’являються Tivento (мідні труби в ізоляції), Swedo (дренажні помпи), Ivensis (монтажні аксесуари) та Cleanairix (професійна сервісна хімія). У 2018 році команда Thermosilesia налічує вже 47 осіб.
    - year: '2019'
      title: Новий логістичний центр
      text: Після переїзду до Руди-Шльонської логістичний центр Thermosilesia зростає до 4 300 м², а кількість палетомісць — до 6 700. Rotenso отримує реальну базу для зростання продажів.
    - year: 2020 – 2022
      title: Від кондиціонування до повного HVAC
      text: 'Пропозиція Rotenso виходить за межі настінних кондиціонерів: з’являються теплові насоси повітря-вода (Aquami, Airmi, Windmi, Heatmi), розширені комерційні системи та блоки VRF/RVF. Обладнання працює на екологічному холодоагенті R32.'
    - year: '2023'
      title: Партнерська мережа зростає
      text: Rotenso розширює мережу авторизованих монтажників і сервісу в Польщі та Європі, поповнює асортимент настінних кондиціонерів (зокрема серії Versu, Mirai, Elis, Ukura, Imoto) і регулярно проводить технічні навчання для монтажної галузі.
    - year: '2024'
      title: Wentilo ICON і 24-річчя Thermosilesia
      text: На виставці MCE у Мілані Rotenso представляє зовсім нову лінійку рекуператорів Wentilo ICON. Thermosilesia святкує 24 роки діяльності, команда налічує 188 осіб, а компанія отримує Діамант Forbes за динаміку розвитку.
    - year: '2025'
      title: Warsaw HVAC Expo і новий центр
      text: Rotenso представляє новинки на Warsaw HVAC Expo. У Руді-Шльонській стартує будівництво однієї з найбільших інвестицій в історії компанії — нового логістичного центру площею понад 17 000 м².
    - year: '2026'
      title: Rotenso сьогодні
      text: Логістичний центр сягає понад 20 000 м² і 29 000 палетомісць. Rotenso випускає новий каталог систем RVF на сезон 2026/27 і нові серії кондиціонерів (зокрема Luve, Teta, Roni, Fresh) та присутній на ринках Польщі, Німеччини, Франції, Чехії, Італії та України.
