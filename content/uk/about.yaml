company:
  background: /images/about/company-bg.jpg
  title: Польська компанія з глобальним баченням
  text: |-
    Rotenso — польський бренд від першого дня. Ми не дистриб’ютор іноземного виробника — ми проєктуємо продукти з огляду на польський клімат, польські будинки й польські умови експлуатації.

    Ми поєднуємо місцеве інженерне ноу-хау з сучасними технологіями, пропонуючи рішення, порівнянні зі світовими лідерами галузі, — за конкурентною ціною та з місцевим сервісом по всій Польщі.
  videoImage: /images/about/company-video.jpg
  videoUrl: ''
ecosystem:
  background: /images/about/ecosystem-bg.jpg
  title: Комплексна екосистема
  text: Кондиціонери, теплові насоси, вентиляція та аксесуари — усе від одного виробника, з однією сервісною мережею та спільною гарантією.
  tiles:
    - image: /images/about/tile-ac.jpg
      title: Кондиціонери
      text: Від базових моделей до преміальних із фільтрацією та Smart Home. Одно- та багатокімнатні (мультиспліт) для будь-якого інтер’єру.
      cta:
        label: Переглянути моделі
        href: /uk/klimatyzacja
    - image: /images/about/tile-reku.jpg
      title: Рекуперація
      text: Рекуператори Wentilo забезпечують постійний приплив свіжого, відфільтрованого повітря та повертають тепло, яке інакше пішло б із дому.
      cta:
        label: Переглянути моделі
        href: /uk/rekuperacja
    - image: /images/about/tile-hp.jpg
      title: Теплові насоси
      text: Теплові насоси повітря-вода для опалення будинку та гарячої води — у версіях спліт, моноблок і all-in.
      cta:
        label: Переглянути моделі
        href: /uk/pompy-ciepla
    - image: /images/about/tile-rvf.jpg
      title: Системи RVF
      text: Системи RVF/VRF для офісів, готелів і комерційних об’єктів — точне керування температурою в багатьох зонах одночасно.
      cta:
        label: Переглянути моделі
        href: /uk/systemy-rvf
