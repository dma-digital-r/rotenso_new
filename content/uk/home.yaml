wentilo:
  title: Свіже повітря завдяки рекуперації
  productName: Wentilo ICON
  text: |-
    Рекуператори Rotenso Wentilo забезпечують постійний приплив свіжого фільтрованого повітря з рекуперацією тепла або вологи й водночас знижують витрати на опалення. Розумне керування гарантує вам комфорт цілий день без додаткового обслуговування.

    Ознайомтеся з рекуператорами серії Rotenso Wentilo ICON і оберіть відповідне рішення для свого дому.
  cta:
    label: Переглянути Wentilo ICON
    href: /uk/rekuperacja/wentilo-icon
  configurator:
    question: Не знаєте, який рекуператор обрати?
    cta: Скористайтеся конфігуратором
    href: /uk/doboromierz/rekuperacja
  background: /images/home/wentilo-bg.png
  media: /images/home/wentilo-media.png
  video: ''
