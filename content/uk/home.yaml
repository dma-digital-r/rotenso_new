seo:
  title: Rotenso
  subtitle: Інноваційні системи HVAC для дому та бізнесу
  text: |-
    Ми — польська компанія, що спеціалізується на кондиціонуванні, рекуперації, теплових насосах і сучасних системах кондиціонування (RVF). Наші продукти відповідають потребам приватних і корпоративних клієнтів. Ми робимо ставку на технології, що забезпечують комфорт, чисте повітря та реальну економію.

    Завдяки постійному розвитку та розширенню каталогу продукції бренд здобуває визнання користувачів і партнерів у всій Європі, пропонуючи рішення для індивідуальних потреб і різних типів будівель. Rotenso — синонім ефективності, інновацій і сучасного дизайну, тому наші пристрої — чудовий вибір для тих, хто шукає якість на роки.
  background: /images/home/seo-bg.png
