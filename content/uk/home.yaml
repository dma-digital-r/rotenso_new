seoTitle: Rotenso — кондиціонування, рекуперація, теплові насоси
seoDescription: Інноваційні системи HVAC для дому та бізнесу — кондиціонери, рекуператори, теплові насоси та системи RVF / VRF.
heroSlides:
  - tab: Кондиціонери
    title: Кондиціонери
    text: Rotenso — це широкий вибір систем кондиціонування, що забезпечують ідеальну температуру цілий рік.
    primary:
      label: Переглянути моделі
      href: /uk/klimatyzacja
    secondary:
      label: Новинки
      href: /uk/klimatyzacja
    background: /images/home/hero-klimatyzacje.png
  - tab: Рекуперація
    title: Рекуперація
    text: Постійний приплив свіжого фільтрованого повітря з рекуперацією тепла або вологи.
    primary:
      label: Переглянути моделі
      href: /uk/rekuperacja
    secondary:
      label: Новинки
      href: /uk/rekuperacja
    background: null
  - tab: Теплові насоси
    title: Теплові насоси
    text: Економне й необслуговуване опалення будівель та приготування гарячої води.
    primary:
      label: Переглянути моделі
      href: /uk/pompy-ciepla
    secondary:
      label: Новинки
      href: /uk/pompy-ciepla
    background: null
  - tab: Системи RVF
    title: Системи RVF
    text: Точне керування температурою в багатьох зонах одночасно — для офісів, готелів і комерційних об’єктів.
    primary:
      label: Переглянути моделі
      href: /uk/systemy-rvf
    secondary:
      label: Новинки
      href: /uk/systemy-rvf
    background: null
idea:
  title: Кондиціонер Rotenso — це комфорт, який ви відчуєте з першої миті.
  text: Він охолоджує, обігріває та очищає повітря, а ваш дім стає справжнім прихистком. Елегантний дизайн і тиха робота роблять пристрої природною частиною інтер’єру. Керування просте й інтуїтивне, тож спокій завжди під рукою.
  background: /images/home/idea-bg.png
