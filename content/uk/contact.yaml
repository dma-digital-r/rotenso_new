form:
  title: Контактна форма
  text: Чого стосується ваше повідомлення?
  topic: Оберіть тему / відділ*
  topics:
    - Запитання про продукт
    - Технічна підтримка / сервіс
    - Гарантія та рекламації
    - Співпраця та монтажники
    - Інвестиції та системи RVF
    - Інше
  name: Ім'я та прізвище*
  email: Адреса e-mail*
  phone: Номер телефону
  postcode: Поштовий індекс
  message: Повідомлення...
  consent: Я погоджуюся на обробку моїх персональних даних...
  consentFull: Адміністратором ваших персональних даних є Thermosilesia sp. z o. o. sp. k. Дані збираються, щоб відповісти на запит, надісланий через контактну форму. Ви маєте право на доступ до своїх даних, їх виправлення, видалення або обмеження обробки, право на перенесення даних, відкликання згоди та заперечення. Деталі обробки доступні на https://rotenso.com/pl/ у розділі «GDPR».
  consentMore:
    label: Детальніше
    href: /uk/rodo
  privacy:
    label: Дізнайтеся, як ми обробляємо ваші дані.
    href: /uk/rodo
  required: '*обов''язкові поля'
  submit: Надіслати повідомлення
  success: Дякуємо! Ваше повідомлення надіслано — ми відповімо якнайшвидше.
  error: Не вдалося надіслати повідомлення. Спробуйте ще раз за хвилину або зателефонуйте нам.
