splitVsMulti:
  title: Спліт чи мультиспліт?
  split:
    image: /images/products/splitVsMulti/split/image.jpg
    title: Спліт-система
    text: Найпростіший і найпопулярніший тип кондиціонування для будинку чи квартири. Складається з одного блока в приміщенні (зазвичай на стіні) та одного блока зовні будівлі. Ідеальне рішення, якщо потрібен комфорт в одній конкретній кімнаті, наприклад у вітальні чи спальні.
  multi:
    image: /images/products/splitVsMulti/multi/image.jpg
    title: Мультиспліт-система
    text: Гарний вибір, якщо ви хочете кондиціонувати кілька приміщень одночасно, але не можете або не хочете монтувати кілька зовнішніх блоків на фасаді. Зовні встановлюється один блок, який обслуговує кілька внутрішніх кондиціонерів. Усе виглядає естетично й займає мало місця.
quoteForm:
  title: Запитати ціну
  text: |-
    Ваш комфорт — наш стандарт.
    Залиште свої контакти, і монтажник підготує для вас пропозицію встановлення кондиціонера.
  background: /images/forms/quoteForm/background.jpg
  step1: |-
    Крок 1.
    Залиште нам свої контактні дані. Ваш запит отримає монтажник кондиціонерів у вашій місцевості.
  phone: Ваш номер телефону*
  email: Ваша адреса e-mail*
  postcode: Поштовий індекс місця монтажу*
  contactTime: Бажаний час зв’язку
  contactTimes:
    - Зранку (8:00–12:00)
    - Удень (12:00–16:00)
    - Увечері (16:00–20:00)
    - Будь-коли
  consent: Я погоджуюся на обробку моїх персональних даних...
  required: '*обов’язкові поля'
  submit: Надіслати повідомлення
  success: Дякуємо! Ваш запит надіслано — монтажник незабаром зв’яжеться з вами.
  error: Не вдалося надіслати запит. Спробуйте ще раз за хвилину або зателефонуйте нам.
  step2Image: /images/forms/quoteForm/step2Image.jpg
  step2: |-
    Крок 2.
    Монтажник зв’яжеться з вами, щоб підібрати відповідний кондиціонер і представити пропозицію.
  step3Image: /images/forms/quoteForm/step3Image.jpg
  step3: |-
    Крок 3.
    Після того як ви приймете пропозицію, монтажник встановить обраний кондиціонер.
